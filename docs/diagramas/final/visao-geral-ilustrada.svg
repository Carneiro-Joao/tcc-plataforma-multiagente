 font-weight="500" fill="#2c3b42" text-anchor="middle" >(currículo, objetivos, método,</text><text x="1270" y="796.86" font-size="16.5" font-weight="500" fill="#2c3b42" text-anchor="middle" >viabilidade, avaliação, inclusão)</text><text x="1270" y="820.29" font-size="16.5" font-weight="500" fill="#2c3b42" text-anchor="middle" >e aponta os problemas.</text>

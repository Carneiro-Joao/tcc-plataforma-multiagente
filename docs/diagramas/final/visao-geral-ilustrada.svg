<text x="60" y="74" font-size="36" font-weight="800" fill="#16242b" text-anchor="start" letter-spacing="-0.5">AulaIA: do pedido do professor ao plano de aula pronto</text>
<text x="60" y="112" font-size="19" font-weight="500" fill="#4f5f67" text-anchor="start" >Planos de aula de Computação do 8º ano, alinhados à BNCC, escritos por agentes de IA e revisados por uma IA Juiz</text>

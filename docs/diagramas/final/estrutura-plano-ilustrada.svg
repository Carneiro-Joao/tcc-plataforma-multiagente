" >Avaliação</text><rect x="90" y="854" width="800" height="44" rx="12" fill="#e3f1f5" stroke="#bfe0ea" stroke-width="1.5"/><rect x="90" y="854" width="7" height="44" rx="3.5" fill="#0f6b84"/><circle cx="132" cy="876" r="15" fill="#16242b"/><text x="132" y="881.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >10</text><text x="162" y="872" font-size="17" font-weight="700" fill="#16242b" text-anchor="start" >Adaptações</text><text x="162" y="891" font-size="14" font-weight="500" fill="#3d4c53" text-anchor="start" >Duas estratégias de inclusão, sem supor diagnósticos</text><rect x="747.2" y="861" width="128.8" height="30" rx="15" fill="#fff" stroke="#bfe0ea" stroke-width="1.5"/><rect x="757.2" y="869" width="14" height="12" rx="3.5" fill="none" stroke="#0f6b84" stroke-width="2.2"/><circle cx="761.7" cy="875" r="1.6" fill="#0f6b84"/><circle cx="766.7" cy="875" r="1.6" fill="#0f6b84"/><text x="779.2" y="881" font-size="14" font-weight="650" fill="#0f6b84" text-anchor="start" >Adaptação</text><text x="94" y="932" font-size="13.5" font-weight="700" fill="#4f5f67" text-anchor="start" letter-spacing="1.3">FONTE</text><rect x="90" y="942" width="800" height="44" rx="12" fill="#f2f5f6" stroke="#dde5e8" stroke-width="1.5"/><rect x="90" y="942" width="7" height="44" rx="3.5" fill="#5a6a72"/><circle cx="132" cy="964" r="15" fill="#16242b"/><text x="132" y="969.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >11</text><text x="162" y="960" font-size="17" font-weight="700" fill="#16242b" text-anchor="start" >Referências</text><text x="162" y="979" font-size="14" font-weight="500" fill="#3d4c53" text-anchor="start" >Só a fonte oficial, com páginas e versão</text><rect x="765.6" y="949" width="110.39999999999999" height="30" rx="15" fill="#fff" stroke="#dde5e8" stroke-width="1.5"/><circle cx="782.6" cy="964" r="6" fill="none" stroke="#5a6a72" stroke-width="2.4"/><path d="M779.1 964 l2.5 2.5 l4.5 -5" stroke="#5a6a72" stroke-width="2" fill="no
<rect x="1000" y="150" width="740" height="860" rx="24" fill="#e6f4ec" stroke="#1f7a4d" stroke-width="2.5"/><text x="1040" y="206" font-size="25" font-weight="800" fill="#1f7a4d" text-anchor="start" >A corrente que garante a coerência</text><text x="1040" y="238" font-size="16" font-weight="500" fill="#2b4a39" text-anchor="start" >Cada objetivo precisa aparecer numa etapa, ter uma evidência e um instrumento.</text><rect x="1040" y="270" width="660" height="126" rx="18" fill="#fff" stroke="#9fcfb3" stroke-width="2" filter="url(#sombra)"/><rect x="1064" y="292" width="56" height="34" rx="9" fill="#1f7a4d"/><text x="1092.0" y="315" font-size="18" font-weight="800" fill="#fff" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">OBJ1</text><text x="1130" y="315" font-size="15" font-weight="600" fill="#1f7a4d" text-anchor="start" letter-spacing="0.6">objetivo</text><text x="1676" y="315" font-size="17" font-weight="700" fill="#16242b" text-anchor="end" >O que o aluno vai aprender</text><text x="1064" y="356" font-size="17" font-weight="500" fill="#2c3b42" text-anchor="start" >“Explicar o funcionamento do</text><text x="1064" y="381" font-size="17" font-weight="500" fill="#2c3b42" text-anchor="start" >algoritmo Bubblesort.”</text><g fill="none" stroke="#1f7a4d" stroke-width="5" stroke-linecap="round"><rect x="1587" y="391" width="26" height="34" rx="13"/><rect x="1587" y="409" width="26" height="34" rx="13" stroke="#58a77c"/></g><rect x="1040" y="430" width="660" height="126" rx="18" fill="#fff" stroke="#9fcfb3" stroke-width="2" filter="url(#sombra)"/><rect x="1064" y="452" width="45" height="34" rx="9" fill="#1f7a4d"/><text x="1086.5" y="475" font-size="18" font-weight="800" fill="#fff" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">ET1</text><text x="1119" y="475" font-size="15" font-weight="600" fill="#1f7a4d" text-anchor="start" letter-spacing="0.6">etapa · 20 min</text><text x="1676" y="475" font-size="17" font-weight="700" fill="#16242b" text-anchor="end" >Quando isso acontece na aula</text><text x="1064" y="516" font-size="17" font-weight="500" fill="#2c3b42" text-anchor="start" >Introdução ao Bubblesort: explicação</text><text x="1064" y="541" font-size="17" font-weight="500" fill="#2c3b42" text-anchor="start" >oral com o projetor, trocas sucessivas.</text><g fill="none" stroke="#1f7a4d" stroke-width="5" stroke-linecap="round"><rect x="1587" y="551" width="26" height="34" rx="13"/><rect x="1587" y="569" width="26" height="34" rx="13" stroke="#58a77c"/></g><rect x="1040" y="590" width="660" height="126" rx="18" fill="#fff" stroke="#9fcfb3" stroke-width="2" filter="url(#sombra)"/><rect x="1064" y="612" width="56" height="34" rx="9" fill="#1f7a4d"/><text x="1092.0" y="635" font-size="18" font-weight="800" fill="#fff" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">EVI1</text><text x="1130" y="635" font-size="15" font-weight="600" fill="#1f7a4d" text-anchor="start" letter-spacing="0.6">evidência</text><text x="1676" y="635" font-size="17" font-weight="700" fill="#16242b" text-anchor="end" >Como saber que aprendeu</text><text x="1064" y="676" font-size="17" font-weight="500" fill="#2c3b42" text-anchor="start" >“O aluno explica oralmente como os</text><text x="1064" y="701" font-size="17" font-weight="500" fill="#2c3b42" text-anchor="start" >elementos adjacentes são comparados e trocados.”</text><g fill="none" stroke="#1f7a4d" stroke-width="5" stroke-linecap="round"><rect x="1587" y="711" width="26" height="34" rx="13"/><rect x="1587" y="729" width="26" height="34" rx="13" stroke="#58a77c"/></g><rect x="1040" y="750" width="660" height="126" rx="18" fill="#fff" stroke="#9fcfb3" stroke-width="2" filter="url(#sombra)"/><rect x="1064" y="772" width="56" height="34" rx="9" fill="#1f7a4d"/><text x="1092.0" y="795" font-size="18" font-weight="800" fill="#fff" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">INS1</text><text x="1130" y="795" font-size="15" font-weight="600" fill="#1f7a4d" text-anchor="start" letter-spacing="0.6">instrumento</text><text x="1676" y="795" font-size="17" font-weight="700" fill="#16242b" text-anchor="end" >Como o professor observa</text><text x="1064" y="836" font-size="17" font-weight="500" fill="#2c3b42" text-anchor="start" >“Arguição oral sobre a lógica de</text><text x="1064" y="861" font-size="17" font-weight="500" fill="#2c3b42" text-anchor="start" >trocas sucessivas do Bubblesort.”</text><rect x="1040" y="910" width="660" height="86" rx="18" fill="#ffffff" stroke="#1f7a4d" stroke-width="2" stroke-dasharray="8 6"/><path d="M1096 924 l26 10 v20 c0 16 -11 26 -26 32 c-15 -6 -26 -16 -26 -32 v-20 z" fill="#1f7a4d"/><path d="M1085 954 l8 8 l15 -16" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1140" y="947" font-size="18" font-weight="700" fill="#1f7a4d" text-anchor="start" >O validador confere a corrente</text><text x="1140" y="974" font-size="15" font-weight="500" fill="#2b4a39" text-anchor="start" >Faltou um elo, ou a soma dos minutos não fecha? O plano é recusado.</text>
